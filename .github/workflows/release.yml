name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (without prefix)
        required: true

permissions:
  contents: write
        
jobs:
  release:
    name: create release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
          
      - name: Bump Version Number
        run: |
          $ver = '${{ github.event.inputs.version }}'
          $json_path = './repo.json'
          $csproj_path = './BetterDresser/BetterDresser.csproj'
          (get-content $json_path) -replace '(\d(.\d){3})', $ver | set-content $json_path
          (get-content $csproj_path) -replace '(\d(.\d){3})', $ver | set-content $csproj_path
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -u
          git commit -m "Version Bump ``${ver}``"
          git push origin main

      - name: Build
        run: |
          dotnet build './BetterDresser/BetterDresser.csproj' --configuration Release --nologo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          path: ./BetterDresser/bin/Release/*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: ./BetterDresser/bin/Release/BetterDresser/latest.zip
